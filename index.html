<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Catch - Mini Jeu GitHub Pages</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #58a6ff;
            text-shadow: 0 0 10px rgba(88, 166, 255, 0.4);
        }
        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            border: 2px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
            background: #161b22;
        }
        canvas {
            display: block;
            background: linear-gradient(to bottom, #090d16, #1b2838);
        }
        .controls {
            display: flex;
            gap: 20px;
            margin-top: 15px;
        }
        .btn-control {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .btn-control:active {
            background: #30363d;
            transform: scale(0.95);
        }
        @media (min-width: 768px) {
            .controls {
                display: none; /* Masqué sur PC, utilisation du clavier */
            }
        }
    </style>
</head>
