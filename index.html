<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Catch - Mini Jeu GitHub Pages</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #58a6ff;
            text-shadow: 0 0 10px rgba(88, 166, 255, 0.4);
        }
        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            border: 2px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
            background: #161b22;
        }
        canvas {
            display: block;
            background: linear-gradient(to bottom, #090d16, #1b2838);
        }
        .controls {
            display: flex;
            gap: 20px;
            margin-top: 15px;
        }
        .btn-control {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .btn-control:active {
            background: #30363d;
            transform: scale(0.95);
        }
        @media (min-width: 768px) {
            .controls {
                display: none; /* Masqué sur PC, utilisation du clavier */
            }
        }
    </style>
</head>
<body>

    <h1>⚡ CYBER CATCH</h1>
    
    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
    </div>

    <div class="controls">
        <button class="btn-control" id="leftBtn">◀</button>
        <button class="btn-control" id="rightBtn">▶</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Paramètres du jeu
        let score = 0;
        let lives = 3;
        let isGameOver = false;

        // Joueur (Collecteur)
        const player = {
            x: canvas.width / 2 - 40,
            y: canvas.height - 50,
            width: 80,
            height: 20,
            speed: 8,
            dx: 0
        };

        // Objets (Items à attraper ou éviter)
        let items = [];
        let spawnTimer = 0;

        // Commandes Clavier
        const keys = {};
        window.addEventListener("keydown", (e) => keys[e.code] = true);
        window.addEventListener("keyup", (e) => keys[e.code] = false);

        // Commandes Tactiles / Boutons
        const leftBtn = document.getElementById("leftBtn");
        const rightBtn = document.getElementById("rightBtn");

        leftBtn.addEventListener("touchstart", () => player.dx = -player.speed);
        leftBtn.addEventListener("touchend", () => player.dx = 0);
        rightBtn.addEventListener("touchstart", () => player.dx = player.speed);
        rightBtn.addEventListener("touchend", () => player.dx = 0);

        leftBtn.addEventListener("mousedown", () => player.dx = -player.speed);
        leftBtn.addEventListener("mouseup", () => player.dx = 0);
        rightBtn.addEventListener("mousedown", () => player.dx = player.speed);
        rightBtn.addEventListener("mouseup", () => player.dx = 0);

        function spawnItem() {
            const types = ['good', 'good', 'bad']; // Plus de chances d'avoir des bons items
            const type = types[Math.floor(Math.random() * types.length)];
            items.push({
                x: Math.random() * (canvas.width - 30),
                y: -30,
                size: 25,
                speed: 3 + Math.random() * 3,
                type: type
            });
        }

        function update() {
            if (isGameOver) return;

            // Gestion Mouvement Clavier PC
            if (keys["ArrowLeft"] || keys["KeyA"]) {
                player.x -= player.speed;
            } else if (keys["ArrowRight"] || keys["KeyD"]) {
                player.x += player.speed;
            } else {
                player.x += player.dx;
            }

            // Limites du canvas
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            // Apparition d'objets
            spawnTimer++;
            if (spawnTimer > 40) {
                spawnItem();
                spawnTimer = 0;
            }

            // Mise à jour des items
            for (let i = items.length - 1; i >= 0; i--) {
                items[i].y += items[i].speed;

                // Collision avec le joueur
                if (
                    items[i].x < player.x + player.width &&
                    items[i].x + items[i].size > player.x &&
                    items[i].y < player.y + player.height &&
                    items[i].y + items[i].size > player.y
                ) {
                    if (items[i].type === 'good') {
                        score += 10;
                    } else {
                        lives--;
                        if (lives <= 0) {
                            isGameOver = true;
                        }
                    }
                    items.splice(i, 1);
                    continue;
                }

                // Supprimer si l'item sort de l'écran
                if (items[i].y > canvas.height) {
                    if (items[i].type === 'good') {
                        lives--; // Perdre une vie si on rate un bon item
                        if (lives <= 0) isGameOver = true;
                    }
                    items.splice(i, 1);
                }
            }
        }

        function draw() {
            // Effacer l'écran
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Dessiner le joueur
            ctx.fillStyle = "#58a6ff";
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#58a6ff";
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.shadowBlur = 0; // Reset ombre

            // Dessiner les items
            items.forEach(item => {
                ctx.fillStyle = item.type === 'good' ? "#2ea043" : "#f85149";
                ctx.beginPath();
                ctx.arc(item.x + item.size / 2, item.y + item.size / 2, item.size / 2, 0, Math.PI * 2);
                ctx.fill();
            });

            // Afficher Score et Vies
            ctx.fillStyle = "#c9d1d9";
            ctx.font = "16px sans-serif";
            ctx.fillText(`Score: ${score}`, 20, 30);
            ctx.fillText(`Vies: ${'❤️'.repeat(lives)}`, canvas.width - 110, 30);

            // Écran de Game Over
            if (isGameOver) {
                ctx.fillStyle = "rgba(13, 17, 23, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#f85149";
                ctx.font = "bold 28px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);

                ctx.fillStyle = "#c9d1d9";
                ctx.font = "16px sans-serif";
                ctx.fillText(`Score final : ${score}`, canvas.width / 2, canvas.height / 2 + 20);
                ctx.fillText("Cliquez pour rejouer", canvas.width / 2, canvas.height / 2 + 60);
                ctx.textAlign = "left";
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Relancer la partie au clic en cas de Game Over
        canvas.addEventListener("click", () => {
            if (isGameOver) {
                score = 0;
                lives = 3;
                items = [];
                isGameOver = false;
            }
        });

        loop();
    </script>
</body>
</html>
