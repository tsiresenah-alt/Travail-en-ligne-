<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription Bossman</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0f172a; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background-color: #1e293b; padding: 30px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5); }
        h1 { text-align: center; color: #22c55e; margin-bottom: 25px; font-size: 24px; letter-spacing: 1px; }
        h2 { font-size: 18px; margin-bottom: 20px; text-align: center; color: #cbd5e1; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 14px; margin-bottom: 8px; color: #94a3b8; }
        input { width: 100%; padding: 12px 15px; background-color: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #ffffff; font-size: 14px; outline: none; }
        input:focus { border-color: #eab308; }
        button { width: 100%; padding: 14px; background-color: #eab308; border: none; border-radius: 8px; color: #000000; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #ca8a04; }
    </style>
</head>
<body>

    <div class="container">
        <h1>BIENVENUE</h1>
        <h2>Inscription Bossman</h2>
        
        <form id="inscriptionForm">
            <div class="form-group">
                <label for="username">Nom d'utilisateur</label>
                <input type="text" id="username" required placeholder="Votre nom (lettres uniquement)">
            </div>
            
            <div class="form-group">
                <label for="phone">Numéro</label>
                <input type="tel" id="phone" pattern="[0-9]{10}" maxlength="10" required placeholder="Ex: 0341234567 (10 chiffres)">
            </div>
            
            <div class="form-group">
                <label for="password">Mot de passe (Mdp)</label>
                <input type="password" id="password" minlength="6" required placeholder="Min. 6 caractères (lettres et chiffres)">
            </div>
            
            <button type="submit">S'inscrire et recevoir 2 000 AR</button>
        </form>
    </div>

    <script>
        document.getElementById('inscriptionForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Empêche la réinitialisation de la page
            
            const password = document.getElementById('password').value;
            const hasLetters = /[a-zA-Z]/.test(password);
            const hasNumbers = /[0-9]/.test(password);
            
            if (password.length < 6) {
                alert("Le mot de passe doit contenir au moins 6 caractères.");
                return;
            }
            
            if (!hasLetters || !hasNumbers) {
                alert("Le mot de passe doit contenir à la fois des lettres et des chiffres.");
                return;
            }
            
            // Redirection vers la page du tableau de bord si tout est correct
            window.location.href = "dashboard.html";
        });
    </script>
</body>
</html>
