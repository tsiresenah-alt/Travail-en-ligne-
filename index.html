<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Snake - GitHub Pages</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #58a6ff;
            text-shadow: 0 0 10px rgba(88, 166, 255, 0.4);
        }
        #score {
            font-size: 1.2rem;
            margin-bottom: 10px;
            font-weight: bold;
        }
        canvas {
            background: #161b22;
            border: 2px solid #30363d;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            display: block;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 70px);
            gap: 10px;
            margin-top: 15px;
        }
        .btn-control {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
        }
        .btn-control:active {
            background: #30363d;
        }
        .btn-up { grid-column: 2; }
        .btn-left { grid-column: 1; }
        .btn-down { grid-column: 2; }
        .btn-right { grid-column: 3; }

        @media (min-width: 768px) {
            .controls {
                display: none; /* Masqué sur PC (utilisation des flèches du clavier) */
            }
        }
    </style>
</head>
